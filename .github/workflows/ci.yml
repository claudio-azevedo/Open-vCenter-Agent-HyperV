name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    # This module only builds for Windows (golang.org/x/sys/windows/svc,
    # internal/hostinfo, ...) - it doesn't cross-compile, and a Windows test
    # binary can't run on a Linux runner anyway.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
